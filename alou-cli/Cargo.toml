[package]
name = "alou-cli"
version = "0.1.10"
edition = "2021"
description = "Alou AI Agent CLI Tool - 终端命令行工具"
authors = ["Alou Team"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
chrono = "0.4.43"
uuid = { version = "1.16.0", features = ["v4"] }
dirs = "6.0.0"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
