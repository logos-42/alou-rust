[package]
name = "alou-cli"
version = "0.2.1"
edition = "2021"
description = "Alou AI Agent CLI Tool - 终端命令行工具"
authors = ["Alou Team"]

[dependencies]
# 序列化
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"

# 异步运行时
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# 时间
chrono = "0.4.43"

# UUID
uuid = { version = "1.16.0", features = ["v4"] }

# 目录
dirs = "6.0.0"

# HTTP 客户端
reqwest = { version = "0.12", features = ["json"] }

# URL 编码
urlencoding = "2.1"

# 日志
log = "0.4"
env_logger = "0.11"

# 命令行参数
clap = { version = "4", features = ["derive"] }

# 正则表达式
regex = "1"

# 文件系统监控
notify = "8.1"

# 行编辑
rustyline = "14.0"

# 彩色输出
colored = "2.1"

# 表格显示
tabled = "0.15"

# futures
futures = "0.3"

# 系统信息
sysinfo = "0.30"
rand = "0.10.0"

# TUI界面
ratatui = "0.26"
crossterm = "0.27"
