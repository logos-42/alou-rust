[package]
name = "alou-desktop"
version = "0.1.9"
description = "Alou Desktop - Web3 AI Agent Desktop Application"
authors = ["Alou Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/alou-pay/aloupay"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package.metadata.tauri]
version = "2.0"
description = "Tauri metadata"

[package.metadata.tauri.winres]
originalFilename = "Alou.exe"
filepath = "bin/Alou.exe"

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
tauri = { version = "2.5", features = [] }
tauri-plugin-shell = "2.2.0"
tauri-plugin-http = "2.4.3"
tauri-plugin-fs = "2.2.1"
tauri-plugin-dialog = "2.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.140", features = [] }
tokio = { version = "1.44.2", features = ["full"] }
reqwest = { version = "0.12.15", features = ["json", "multipart"] }
k256 = { version = "0.13.4", features = ["ecdsa"] }
sha2 = "0.10.8"
hex = "0.4.3"
open = "5.3.2"
axum = { version = "0.8.3", features = ["json"] }
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["cors"] }
base64 = "0.22.1"
tempfile = "3.19.1"
uuid = { version = "1.16.0", features = ["v4"] }
chrono = { version = "0.4.43", features = ["serde"] }
log = { version = "0.4.27", features = ["serde"] }
bs58 = { version = "0.5.1", features = ["std"] }
urlencoding = "2.1.3"
regex = "1.11.1"
glob = "0.3.2"
walkdir = "2.5.0"
async-trait = "0.1.88"
futures = "0.3.31"
tokio-stream = { version = "0.1.17", features = ["fs"] }
tokio-util = { version = "0.7.15", features = ["codec"] }
serde_yaml = { version = "0.9.34", features = [] }
toml = "0.8.20"
dirs = "6.0.0"
whoami = { version = "1.6.0", features = [] }
sysinfo = { version = "0.34.2", features = ["serde"] }

# DIAP SDK for ZKP support - 使用最小化配置避免内存问题
diap-rs-sdk = { version = "0.2.11", default-features = false, features = ["embedded-noir"] }
anyhow = "1.0.98"
env_logger = "0.11.8"
ed25519-dalek = "2.1.1"

flate2 = "1.1.1"
which = "7.0.2"
rand = "0.9.1"
brotli = "8.0.2"

# Agent 模块依赖
aes-gcm = "0.10.3"
thiserror = "2.0.12"

# Iroh P2P networking
iroh = { version = "0.34.1", optional = true }

# IPFS client
ipfs-api-backend-hyper = { version = "0.6.0", features = ["with-send-sync"] }
libipld = { version = "0.16.0", features = ["dag-cbor", "serde-codec"] }

# Required for async traits - already defined above
# async-trait = "0.1"

[features]
# This feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Link-time optimization
codegen-units = 1   # Better optimization
strip = true        # Strip symbols
