[package]
name = "alou_code_api"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
runtime = { package = "alou_code_runtime", path = "../runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
telemetry = { package = "alou_code_telemetry", path = "../telemetry" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "request_building"
harness = false