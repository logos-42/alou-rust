database_id = "placeholder-create-with-wrangler"

[[env.staging.kv_namespaces]]
binding = "SESSIONS"
id = "placeholder-create-with-wrangler"

[[env.staging.kv_namespaces]]
binding = "CACHE"
id = "placeholder-create-with-wrangler"

[[env.staging.kv_namespaces]]
binding = "NONCES"
id = "placeholder-create-with-wrangler"

[[env.staging.durable_objects.bindings]]
name = "AI_TASKS"
class_name = "AITaskDO"

