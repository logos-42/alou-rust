[package]
name = "alou-desktop"
version = "0.1.4"
description = "Alou Desktop - Web3 AI Agent Desktop Application"
authors = ["Alou Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/alou-pay/aloupay"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package.metadata.tauri]

[package.metadata.tauri.winres]
OriginalFilename = "Alou.exe"
FileDescription = "Alou Desktop"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-updater = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "multipart"] }
k256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
hex = "0.4"
open = "5.0"
axum = { version = "0.7", features = ["json"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
base64 = "0.22"
tempfile = "3.10"
uuid = { version = "1.7", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
diap-rs-sdk = { version = "0.2.11", default-features = false, features = ["embedded-noir"] }
log = "0.4"
bs58 = "0.5"
urlencoding = "2.1"

[features]
# This feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Link-time optimization
codegen-units = 1   # Better optimization
strip = true        # Strip symbols
