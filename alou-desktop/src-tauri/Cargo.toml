[package]
name = "alou-desktop"
version = "0.3.1"
description = "Alou Desktop - Web4 AI Agent Desktop Application"
authors = ["Alou Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/alou-pay/aloupay"
edition = "2021"

[package.metadata.tauri]
version = "2.0"
description = "Tauri metadata"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "multipart"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
async-trait = "0.1"
futures = "0.3"
dirs = "6"

# Database
sqlx = { version = "0.8.6", features = ["runtime-tokio-native-tls", "sqlite", "postgres"] }
redis = { version = "1.0.5", features = ["tokio-comp", "json"] }

# Encryption
aes-gcm = "0.10"

# IPFS
ipfs-api-backend-hyper = { version = "0.6", features = ["with-send-sync"] }

# Bot Gateway
iroh = "0.96"
iroh-gossip = "0.96"

# JavaScript Runtime
rquickjs = { version = "0.10", features = ["full", "parallel"] }

# DIAP SDK
diap-rs-sdk = { version = "0.2", default-features = false, features = ["embedded-noir"] }
anyhow = "1"

# Utils
hex = "0.4"
sha2 = "0.10"
sha3 = "0.10"
k256 = { version = "0.13", features = ["ecdsa", "arithmetic"] }
ed25519-dalek = "2"
bs58 = { version = "0.5", features = ["std"] }
bip39 = "2"
regex = "1"
glob = "0.3"
walkdir = "2"
urlencoding = "2"
tempfile = "3"
whoami = "2"
sysinfo = "0.36"
serde_yaml = "0.9"
toml = "0.8"
rand = "0.9"
bytes = "1"
futures-lite = "2"
blake3 = "1"
which = "8"
flate2 = "1"
brotli = "8"
dashmap = "6"
thiserror = "2"
tokio-stream = { version = "0.1", features = ["fs"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-cron-scheduler = "0.15"
axum = { version = "0.8", features = ["json"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
open = "5"

[features]
custom-protocol = ["tauri/custom-protocol"]

# Binary targets
[[bin]]
name = "alou-desktop"
path = "src/main.rs"

[[bin]]
name = "alou-cli"
path = "src/main_cli.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
