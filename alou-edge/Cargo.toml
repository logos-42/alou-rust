[package]
name = "alou-edge"
version = "0.2.5"
edition = "2021"
description = "Alou Edge - Web3 AI Agent on Cloudflare Workers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/alou-pay/aloupay"

[lib]
crate-type = ["cdylib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
# Core dependencies
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
async-trait = "0.1.88"
thiserror = "2.0.12"
futures = "0.3.31"
anyhow = "1.0.98"

# Cloudflare Workers
worker = { version = "0.6.7", default-features = false, features = ["queue"] }
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.50"
js-sys = "0.3.77"
web-sys = { version = "0.3.77", features = ["console", "Window"] }
console_error_panic_hook = "0.1.7"

# UUID and time
uuid = { version = "1.16.0", features = ["v4", "serde", "js"] }
chrono = { version = "0.4.43", features = ["serde", "wasmbind"] }

# Async primitives (sync only, no net for WASM compatibility)
tokio = { version = "1.44.2", default-features = false, features = ["sync", "time"] }

# Timers for WASM
gloo-timers = { version = "0.3.0", features = ["futures"] }

# HTTP client for Claude API (only for non-WASM testing)
reqwest = { version = "0.12.15", default-features = false, features = ["json", "multipart"], optional = true }

# Note: We implement Claude API client directly using worker's fetch
# because official SDKs don't support WASM/Cloudflare Workers environment

# JWT (using jwt-simple which is WASM-compatible)
jwt-simple = "0.12.12"

# Crypto for signature verification
hex = "0.4.3"
sha2 = "0.10.8"
hmac = "0.12.1"
base64 = "0.22.1"
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa", "std"] }
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["rand_core", "std"] }
getrandom = { version = "0.2.15", features = ["js"] }
bs58 = "0.5.1"

# Regex for text parsing (WASM-compatible)
regex = { version = "1.11.1", default-features = false, features = ["std"] }
# ABI & 工具
ethabi = { version = "18.0.0", default-features = false, features = ["std", "serde", "full-serde"] }
once_cell = "1.21.3"
http = "1.3.1"


[features]
default = []
testing = ["reqwest"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Optimize dependencies for size
[profile.release.package."*"]
opt-level = "z"
strip = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12.15", default-features = true, features = ["json"] }

[dev-dependencies]
rand = "0.9.0"