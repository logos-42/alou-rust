[package]
name = "alou-desktop"
version = "0.2.0"
description = "Alou Desktop - Web3 AI Agent Desktop Application"
authors = ["Alou Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/alou-pay/aloupay"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package.metadata.tauri]
version = "2.0"
description = "Tauri metadata"

[package.metadata.tauri.winres]
originalFilename = "Alou.exe"
filepath = "bin/Alou.exe"

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
tauri = { version = "2.5", features = [] }
tauri-plugin-shell = "2.2"
tauri-plugin-http = "2.4"
tauri-plugin-fs = "2.4"
tauri-plugin-dialog = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = [] }
tokio = { version = "1.46", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
k256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
hex = "0.4"
open = "5"
axum = { version = "0.8", features = ["json"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
base64 = "0.22"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
log = { version = "0.4", features = ["serde"] }
bs58 = { version = "0.5", features = ["std"] }
urlencoding = "2"
regex = "1"
glob = "0.3"
walkdir = "2"
async-trait = "0.1"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["fs"] }
tokio-util = { version = "0.7", features = ["codec"] }
serde_yaml = "0.9"
toml = "0.8"
dirs = "6"
whoami = "1"
sysinfo = "0.36"

# DIAP SDK for ZKP support - 使用最小化配置避免内存问题
diap-rs-sdk = { version = "0.2", default-features = false, features = ["embedded-noir"] }
anyhow = "1"
env_logger = "0.11"
ed25519-dalek = "2"

flate2 = "1"
which = "8"
rand = "0.9"
brotli = "8"

# Agent 模块依赖
aes-gcm = "0.10"
thiserror = "2"

# IPFS client
ipfs-api-backend-hyper = { version = "0.6", features = ["with-send-sync"] }
libipld = { version = "0.16", features = ["dag-cbor", "serde-codec"] }

# Bot Gateway dependencies
iroh = { version = "0.34", optional = true }

# Required for async traits - already defined above
# async-trait = "0.1"

[features]
# This feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Link-time optimization
codegen-units = 1   # Better optimization
strip = true        # Strip symbols
