name = "alou-edge"
main = "src/worker.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm run build"
# 确保在构建时先编译 Rust WASM，然后 wrangler 会处理 TypeScript
# TypeScript 入口文件已在顶层 main 字段指定，wrangler 会自动编译并包含所有导入的模块

# Wasm 模块规则配置
[[rules]]
globs = ["**/*.wasm"]
type = "CompiledWasm"

[vars]
ENVIRONMENT = "development"
AI_PROVIDER = "deepseek"
AI_MODEL = "deepseek-chat"
ETH_RPC_URL = "https://eth.llamarpc.com"
ETH_TESTNET_RPC_URL = "https://ethereum-sepolia-rpc.publicnode.com"
SOL_RPC_URL = "https://api.mainnet-beta.solana.com"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "alou-edge-dev"
database_id = "ea73e830-b195-4ad8-9dea-f61677f3714c"

# KV Namespaces
[[kv_namespaces]]
binding = "SESSIONS"
id = "7842a26c3e754cf99e54ea706f01ad6e"
preview_id = "8ea65c9f41a34706992c3c77048f3155"

[[kv_namespaces]]
binding = "CACHE"
id = "41a7073e13e84444a37f044f8467a50c"

[[kv_namespaces]]
binding = "NONCES"
id = "e0f682098b73485b940f1176417f417a"

# Queue configuration for batch agent creation (requires Workers Paid plan)
# [[queues.producers]]
# queue = "agent-creation-queue"
# binding = "AGENT_CREATION_QUEUE"

# [[queues.consumers]]
# queue = "agent-creation-queue"
# max_batch_size = 10
# max_batch_timeout = 30

# Secrets (set with: wrangler secret put <NAME>)
# AI_API_KEY - API key for the selected AI provider (DeepSeek/Qwen/OpenAI/Claude)
# JWT_SECRET - Secret for JWT token signing
# ETH_RPC_URL - Ethereum RPC endpoint (e.g., Infura, Alchemy)
# SOL_RPC_URL - Solana RPC endpoint

# Durable Objects for AI task management
[[durable_objects.bindings]]
name = "AI_TASKS"
class_name = "AITaskDO"

# Migrations for Durable Objects (main environment)
# Durable Objects already exist, no migration needed
# [[migrations]]
# tag = "v1"
# new_sqlite_classes = ["AITaskDO"]


  [vars.development]
  DIAP_IPFS_API_URL = "http://127.0.0.1:5001"
  DIAP_IPFS_GATEWAY_URL = "http://127.0.0.1:8080"
# Production environment
[env.production]
name = "alou-edge-prod"
vars = { ENVIRONMENT = "production" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "alou-edge-prod"
database_id = "placeholder-create-with-wrangler"

[[env.production.kv_namespaces]]
binding = "SESSIONS"
id = "placeholder-create-with-wrangler"

[[env.production.kv_namespaces]]
binding = "CACHE"
id = "placeholder-create-with-wrangler"

[[env.production.kv_namespaces]]
binding = "NONCES"
id = "placeholder-create-with-wrangler"

[[env.production.durable_objects.bindings]]
name = "AI_TASKS"
class_name = "AITaskDO"

# [[env.production.migrations]]
# tag = "v1"
# new_sqlite_classes = ["AITaskDO"]
# 注释掉迁移配置，因为 AITaskDO 已经存在

# Staging environment
[env.staging]
name = "alou-edge-staging"
vars = { ENVIRONMENT = "staging" }

[[env.staging.d1_databases]]
binding = "DB"
