[package]
name = "alou-desktop"
version = "0.1.9"
description = "Alou Desktop - Web3 AI Agent Desktop Application"
authors = ["Alou Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/alou-pay/aloupay"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package.metadata.tauri]
version = "2.0"
description = "Tauri metadata"

[package.metadata.tauri.winres]
originalFilename = "Alou.exe"
filepath = "bin/Alou.exe"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-updater = "2.0.0"
tauri-plugin-http = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = [] }
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "multipart"] }
k256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
hex = "0.4"
open = "5.0"
axum = { version = "0.7", features = ["json"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
base64 = "0.22"
tempfile = "3.10"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
log = { version = "0.4", features = ["serde"] }
bs58 = { version = "0.5", features = ["std"] }
urlencoding = "2.1"
regex = "1.10"
glob = "0.3"
walkdir = "2.4"
async-trait = "0.1"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["fs"] }
tokio-util = { version = "0.7", features = ["codec"] }
serde_yaml = { version = "0.9", features = [] }
toml = "0.9"
dirs = "6.0"
whoami = { version = "2.0.2", features = [] }
sysinfo = { version = "0.37", features = ["serde"] }

# DIAP SDK for ZKP support - 使用最小化配置避免内存问题
diap-rs-sdk = { version = "0.2.11", default-features = false, features = ["embedded-noir"] }
anyhow = "1.0"
env_logger = "0.11"
ed25519-dalek = "2.0"

flate2 = "1.0"
which = "8.0.0"
rand = "0.9.2"
brotli = "8.0.2"

[features]
# This feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Link-time optimization
codegen-units = 1   # Better optimization
strip = true        # Strip symbols
