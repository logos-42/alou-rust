name = "alou-edge-ts"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"

# Secrets (设置方式: wrangler secret put ANTHROPIC_API_KEY)
# ANTHROPIC_API_KEY = "通过 wrangler secret put 设置"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "alou-edge-dev"
database_id = "placeholder"

# KV Namespaces
[[kv_namespaces]]
binding = "SESSIONS"
id = "placeholder"

[[kv_namespaces]]
binding = "CACHE"
id = "placeholder"

# 开发环境配置
[dev]
port = 8787
local_protocol = "http"
